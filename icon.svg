<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c6ab67"/>
      <stop offset="100%" stop-color="#8f7338"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111714"/>
      <stop offset="100%" stop-color="#090c0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .outline{stroke:url(#gold);stroke-width:10;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .thin{stroke:#4f6f4c;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;fill:none;opacity:.95}
      .poly{stroke:#233323;stroke-width:5;stroke-linejoin:round}
      .goldStroke{stroke:#a78d56;stroke-width:5;stroke-linejoin:round}
      .eye{fill:#d9c86d;stroke:#7e6b2e;stroke-width:3}
    </style>
  </defs>

